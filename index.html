<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooks Explore</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 2rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .links-list li {
            margin: 10px 0;
        }
        .links-list a {
            display: block;
            padding: 12px;
            background-color: #f8f9fa;
            color: #3498db;
            text-decoration: none;
            border-radius: 5px;
            border: 1px dashed #bdc3c7;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .links-list a:hover {
            background-color: #e8f4fd;
            border-color: #3498db;
            color: #2980b9;
        }
        .footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Brooks Explore</h1>
        <div class="subtitle">Temporary Index</div>
        
        <ul class="links-list">
            <li><a href="#">[ Placeholder Link 1 ]</a></li>
            <li><a href="#">[ Placeholder Link 2 ]</a></li>
            <li><a href="#">[ Placeholder Link 3 ]</a></li>
            <li><a href="#">[ Placeholder Link 4 ]</a></li>
            <li><a href="#">[ Placeholder Link 5 ]</a></li>
        </ul>

        <div class="footer">
            &copy; 2026 Brooks Explore. All rights reserved.
        </div>
    </div>

</body>
</html>
