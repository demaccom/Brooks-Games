<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmless_Tomato | By Brooks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1a1a, #0a0a0a);
            min-height: 100vh;
            color: #ffffff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: #ff4d4d; /* Tomato Red accent */
            box-shadow: 0 10px 30px -10px rgba(255, 77, 77, 0.3);
        }
        .animate-in {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
    </style>
</head>
<body class="flex flex-col items-center px-6 py-12">

    <header class="text-center mb-12 animate-in">
        <div class="relative inline-block mb-6">
            <div class="w-32 h-32 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-2xl">
                    <!-- Legs/Feet -->
                    <path d="M40 85 Q40 95 35 95" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
                    <path d="M60 85 Q60 95 65 95" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
                    
                    <!-- Arms -->
                    <path d="M25 60 Q10 55 15 45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
                    <path d="M75 60 Q90 55 85 45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />

                    <!-- Main Tomato Body -->
                    <circle cx="50" cy="55" r="35" fill="url(#tomatoGradient)" />
                    
                    <!-- Defining Gradient -->
                    <defs>
                        <linearGradient id="tomatoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ee5253;stop-opacity:1" />
                        </linearGradient>
                    </defs>

                    <!-- Stem & Leaves -->
                    <path d="M50 20 L50 10 M40 22 Q50 15 60 22 M45 20 Q50 5 55 20" stroke="#2ecc71" stroke-width="4" fill="none" stroke-linecap="round" />
                    
                    <!-- Face -->
                    <circle cx="40" cy="50" r="3" fill="#2d3436" /> <!-- Left Eye -->
                    <circle cx="60" cy="50" r="3" fill="#2d3436" /> <!-- Right Eye -->
                    <path d="M42 65 Q50 72 58 65" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round" /> <!-- Smile -->
                </svg>
            </div>
            <div class="absolute bottom-2 right-2 w-6 h-6 bg-green-500 border-2 border-black rounded-full" title="Online"></div>
        </div>
        
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Harmless_Tomato</h1>
    </header>

    <main class="w-full max-w-md space-y-4">
        
        <!-- Updated Link: YouTube -->
        <a href="https://www.youtube.com/@harmless_tomato" target="_blank" rel="noopener noreferrer" class="glass-card flex items-center p-4 rounded-2xl animate-in stagger-1 group">
            <div class="w-12 h-12 bg-red-600/20 rounded-xl flex items-center justify-center mr-4 group-hover:bg-red-600/40 transition-colors">
                <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>
            <div class="flex-grow">
                <h3 class="font-semibold text-white">YouTube Channel</h3>
                <p class="text-xs text-gray-400">Subscribe for new content</p>
            </div>
            <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>

        <!-- Link Template 2: Official Webpage -->
        <a href="#" class="glass-card flex items-center p-4 rounded-2xl animate-in stagger-2 group">
            <div class="w-12 h-12 bg-blue-600/20 rounded-xl flex items-center justify-center mr-4 group-hover:bg-blue-600/40 transition-colors">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
            </div>
            <div class="flex-grow">
                <h3 class="font-semibold text-white">Official Website</h3>
                <p class="text-xs text-gray-400">Read the blog and more</p>
            </div>
            <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>

        <!-- Link Template 3: Portfolio -->
        <a href="#" class="glass-card flex items-center p-4 rounded-2xl animate-in stagger-3 group">
            <div class="w-12 h-12 bg-purple-600/20 rounded-xl flex items-center justify-center mr-4 group-hover:bg-purple-600/40 transition-colors">
                <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div class="flex-grow">
                <h3 class="font-semibold text-white">Portfolio</h3>
                <p class="text-xs text-gray-400">Check out Brooks' work</p>
            </div>
            <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>

    </main>

    <footer class="mt-auto pt-20 pb-8 text-center animate-in stagger-3">
        <div class="flex justify-center space-x-6 mb-8">
            <button id="shareBtn" class="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-full text-sm font-medium transition-all border border-white/5 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                Share Profile
            </button>
        </div>
        <p class="text-gray-600 text-xs tracking-widest uppercase">© 2024 Harmless_Tomato</p>
    </footer>

    <!-- Toast Notification Logic -->
    <div id="toast" class="fixed bottom-8 bg-white text-black px-6 py-3 rounded-full font-bold shadow-2xl opacity-0 transform translate-y-10 transition-all duration-300 pointer-events-none">
        Link copied to clipboard!
    </div>

    <script>
        document.getElementById('shareBtn').addEventListener('click', function() {
            const dummy = document.createElement('input');
            const text = window.location.href;
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
            }, 2000);
        });
    </script>
</body>
</html>
